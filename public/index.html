<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SportScript.ai decodes every NFL betting line: what it says, why it sits there, and how each side covers.">
<title>SportScript.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
body { margin: 0; }

/* Layout: phone-first reader. Board of games -> one game decoded top to bottom. Favorite = blue, underdog = orange, everywhere. */
:root {
  --bg: #f2f4f8;
  --card: #ffffff;
  --card-2: #f6f8fc;
  --ink: #0f1728;
  --muted: #586378;
  --rule: #e1e6ef;
  --fav: #2b59f5;
  --fav-soft: #e6ecff;
  --dog: #ad4a07;
  --on-fav: #ffffff;
  --on-dog: #ffffff;
  --dog-soft: #ffece0;
  --ok: #0f8a5f;
  --shadow: 0 1px 2px rgba(15, 23, 40, .06), 0 8px 24px rgba(15, 23, 40, .07);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "DM Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r-xl: 26px; --r-lg: 20px; --r-md: 14px; --pill: 999px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1020; --card: #141b2e; --card-2: #1a2238; --ink: #edf1fa; --muted: #9aa4ba; --rule: #273150;
  --fav: #7a94ff; --fav-soft: #1d2a55; --dog: #ff8f4d; --dog-soft: #3a2416; --ok: #3fcf98; --on-fav: #0b1020; --on-dog: #0b1020;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1020; --card: #141b2e; --card-2: #1a2238; --ink: #edf1fa; --muted: #9aa4ba; --rule: #273150;
  --fav: #7a94ff; --fav-soft: #1d2a55; --dog: #ff8f4d; --dog-soft: #3a2416; --ok: #3fcf98; --on-fav: #0b1020; --on-dog: #0b1020;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--fav); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 120px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(34px, 9vw, 48px); font-weight: 800; line-height: 1; letter-spacing: -.02em; }
h2 { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h3 { font-size: 20px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }

.brand { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.logo svg { flex: none; }
.themebtn { border: 0; cursor: pointer; width: 40px; height: 40px; padding: 0; justify-content: center; flex: none; }
.brand { min-width: 0; }
.brand .logo { flex: none; }
.wkbar { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
.wkbar::-webkit-scrollbar { display: none; }
.wkbar button { flex: none; min-height: 40px; padding: 0 14px; border: 0; border-radius: var(--pill); background: var(--card); box-shadow: var(--shadow); font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; }
.wkbar button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.wkbar button small { font-weight: 500; margin-left: 4px; opacity: .8; }
.res { display: flex; gap: 8px; flex-wrap: wrap; }
.res .pill.ok { background: var(--ink); color: var(--bg); }
.tld { color: var(--fav); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--pill); background: var(--card); box-shadow: var(--shadow); font-size: 13px; font-weight: 700; white-space: nowrap; }
.lede { font-size: 17px; color: var(--muted); max-width: 56ch; }
.lede b { color: var(--ink); }

.card { background: var(--card); border-radius: var(--r-xl); box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.inset { background: var(--card-2); border-radius: var(--r-lg); padding: 14px; }
.day { margin-top: 6px; }

/* board cards */
.gcard { width: 100%; text-align: left; border: 0; cursor: pointer; }
.gcard:hover { transform: translateY(-1px); }
.gtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
.teams { display: flex; flex-direction: column; gap: 8px; }
.trow { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--rule); }
.dot.fav { background: var(--fav); } .dot.dog { background: var(--dog); }
.tname { font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 1.1; min-width: 0; overflow-wrap: anywhere; }
.tname small { font-family: var(--body); font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.tpts { font-family: var(--display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.lines { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--pill); font-size: 14px; font-weight: 700; background: var(--card-2); }
.flag { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; font-weight: 500; color: var(--ink); background: var(--dog-soft); border-radius: var(--r-md); padding: 8px 12px; }
.flag svg { flex: none; margin-top: 2px; color: var(--dog); }
.flag.mv { background: var(--fav-soft); }
.flag.mv svg { color: var(--fav); }
.alert { background: var(--dog-soft); }
.alert h3 { display: flex; align-items: center; gap: 8px; font-size: 19px; }
.alert h3 svg { color: var(--dog); }
.start { background: var(--fav-soft); }
.start h3 { font-size: 19px; }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; counter-increment: s; }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--fav); color: var(--on-fav); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.startrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--pill); font-weight: 700; cursor: pointer; background: var(--fav); color: var(--on-fav); }
.btn.ghost { background: var(--card); color: var(--ink); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.gloss { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.gloss div { border-top: 1px solid var(--rule); padding-top: 10px; }
.gloss div:first-child { border-top: 0; padding-top: 0; }
.mlp { font-weight: 500; opacity: .85; padding-left: 8px; margin-left: 2px; border-left: 1px solid currentColor; }
.where { display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 1px; }
.wxs { font-size: 12px; white-space: nowrap; }
.pill.fav { background: var(--fav-soft); color: var(--fav); }
.pill.dog { background: var(--dog-soft); color: var(--dog); }
.winbar { display: flex; height: 30px; border-radius: var(--pill); overflow: hidden; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.winbar span { display: flex; align-items: center; padding: 0 12px; white-space: nowrap; min-width: 0; }
.winbar .f { background: var(--fav); color: var(--on-fav); }
.winbar .d { background: var(--dog); color: var(--on-dog); justify-content: flex-end; }
.decode { display: flex; justify-content: space-between; align-items: center; padding-top: 4px; font-weight: 700; color: var(--fav); }
.final { font-weight: 700; color: var(--ink); }

/* game page */
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--pill); background: var(--card); box-shadow: var(--shadow); font-weight: 700; cursor: pointer; }
.hero { gap: 16px; }
.hero .vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; text-align: center; }
.side { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.side .nm { font-family: var(--display); font-size: clamp(20px, 6vw, 26px); font-weight: 800; line-height: 1.05; overflow-wrap: anywhere; }
.side .rec { font-size: 13px; color: var(--muted); }
.side .sc { font-family: var(--display); font-size: clamp(38px, 12vw, 54px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.side.fav .sc { color: var(--fav); } .side.dog .sc { color: var(--dog); }
.at { font-family: var(--display); font-weight: 700; color: var(--muted); }
.hero-sub { text-align: center; font-size: 14px; color: var(--muted); }
.bul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.bul li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; }
.bul li::before { content: ""; width: 10px; height: 10px; margin-top: 8px; margin-left: 4px; border-radius: 50%; background: var(--rule); }
.bul.fav li::before { background: var(--fav); } .bul.dog li::before { background: var(--dog); }
.bul.ok li::before { background: var(--ok); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.secnum { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700; margin-right: 8px; }
.sec-h { display: flex; align-items: center; }
.sec-h h3 { font-size: 21px; }

/* line math visual */
.ladder { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rung { background: var(--card-2); border-radius: var(--r-md); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; text-align: center; }
.rung b { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.rung span { font-size: 12px; color: var(--muted); }
.rung.now { background: var(--fav-soft); }
.rung.now b { color: var(--fav); }

/* market vs stats */
.mvs { display: flex; flex-direction: column; gap: 12px; }
.mrow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; }
.track { position: relative; height: 26px; border-radius: var(--pill); background: var(--card-2); }
.track .mid { position: absolute; left: 50%; top: 4px; bottom: 4px; width: 2px; background: var(--rule); }
.track .bar { position: absolute; top: 3px; bottom: 3px; border-radius: var(--pill); display: flex; align-items: center; font-size: 12px; font-weight: 700; color: var(--on-fav); padding: 0 8px; white-space: nowrap; }
.axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding-left: 106px; }

/* matchup units */
.unit { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid var(--rule); }
.unit:first-child { border-top: 0; padding-top: 0; }
.unit-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.unit-h b { font-size: 15px; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: var(--pill); background: var(--card-2); color: var(--muted); white-space: nowrap; }
.tag.o { background: var(--fav-soft); color: var(--fav); }
.tag.d { background: var(--dog-soft); color: var(--dog); }
.pbar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 44px; gap: 8px; align-items: center; font-size: 13px; }
.pbar .t { height: 10px; border-radius: var(--pill); background: var(--card-2); overflow: hidden; }
.pbar .t i { display: block; height: 100%; border-radius: var(--pill); background: var(--ink); }

/* paths */
.paths { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.path { border-radius: var(--r-xl); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.path.fav { background: var(--fav-soft); }
.path.dog { background: var(--dog-soft); }
.path.neutral { background: var(--card-2); }
.path-h { display: flex; flex-direction: column; gap: 2px; }
.path-h span { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.path-h b { font-family: var(--display); font-size: 22px; font-weight: 800; }
.path.fav .path-h b { color: var(--fav); } .path.dog .path-h b { color: var(--dog); }
.watch { font-size: 13px; color: var(--muted); }
.watch b { color: var(--ink); }
.note { font-size: 13px; color: var(--muted); }

/* ratings */
.rrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1.3fr) 48px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule); font-size: 15px; }
.rrow:first-child { border-top: 0; }
.rrow .rk { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.rrow .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.rtrack { position: relative; height: 12px; border-radius: var(--pill); background: var(--card-2); }
.rtrack .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--rule); }
.rtrack i { position: absolute; top: 0; bottom: 0; border-radius: var(--pill); }

/* tabs */
nav.tabs { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; z-index: 5; background: var(--card); box-shadow: 0 10px 30px rgba(15, 23, 40, .18); border-radius: 30px; padding: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
nav.tabs button { min-height: 52px; border: 0; background: transparent; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
nav.tabs button[aria-current="page"] { background: var(--fav-soft); color: var(--fav); }
/* game day */
.gd { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.wx { display: flex; gap: 12px; align-items: center; }
.wx svg { flex: none; color: var(--muted); }
.wxstats { display: flex; gap: 8px; flex-wrap: wrap; }
.ml { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--rule); }
.ml:first-of-type { border-top: 0; }
.ml b { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.ml.fav b { color: var(--fav); } .ml.dog b { color: var(--dog); }
.ml span.small { grid-column: 1 / -1; }
/* team tabs */
.ttabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: var(--pill); background: var(--card-2); }
.ttabs button { min-height: 44px; border: 0; border-radius: var(--pill); background: transparent; font-weight: 700; color: var(--muted); cursor: pointer; }
.ttabs button[aria-pressed="true"].fav { background: var(--fav); color: var(--on-fav); }
.ttabs button[aria-pressed="true"].dog { background: var(--dog); color: var(--on-dog); }
.ttabs button[aria-pressed="true"]:not(.fav):not(.dog) { background: var(--card); color: var(--ink); }
/* injuries */
.inj { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--rule); font-size: 15px; }
.inj:first-child { border-top: 0; padding-top: 0; }
.inj .who b { font-weight: 700; } .inj .who span { color: var(--muted); font-size: 13px; margin-left: 6px; }
.inj .st { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: var(--pill); background: var(--card-2); white-space: nowrap; align-self: center; }
.inj .st.out { background: var(--ink); color: var(--bg); }
.inj .st.q { background: var(--dog-soft); color: var(--dog); }
.inj .st.ok { background: var(--card-2); color: var(--ok); }
.inj .sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
/* records strip */
.recs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.recs div { background: var(--card-2); border-radius: var(--r-md); padding: 10px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.recs b { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.recs span { font-size: 12px; color: var(--muted); }
.games5 { display: flex; flex-direction: column; }
.g5 { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 34px); gap: 6px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.g5.h { border-top: 0; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; padding-bottom: 2px; }
.g5 .r { text-align: center; font-weight: 700; border-radius: 8px; padding: 2px 0; font-size: 13px; }
.g5.h .r { padding: 0; font-size: 11px; }
.r.W, .r.O { background: var(--fav-soft); color: var(--fav); }
.r.L, .r.U { background: var(--dog-soft); color: var(--dog); }
.r.P, .r.T { background: var(--card-2); color: var(--muted); }
.g5.h .r { background: none; color: var(--muted); }
/* ladders, price, spots, coaches */
.lad { display: flex; flex-direction: column; }
.lrow { display: grid; grid-template-columns: minmax(92px, 1.1fr) minmax(0, 2fr) 92px; gap: 10px; align-items: center; padding: 7px 8px; border-radius: var(--r-md); font-size: 14px; }
.lrow.h { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; padding-bottom: 2px; }
.lrow.now { background: var(--fav-soft); font-weight: 700; }
.lrow .nums { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.split { display: flex; height: 12px; border-radius: var(--pill); overflow: hidden; background: var(--card-2); }
.split i { display: block; height: 100%; }
.split .a { background: var(--fav); } .split .p { background: var(--rule); } .split .b { background: var(--dog); }
.split .o { background: var(--ok); } .split .u { background: var(--muted); }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--rule); font-size: 15px; }
.prow:first-child { border-top: 0; }
.prow b { font-variant-numeric: tabular-nums; }
.prow .be { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.coach { display: flex; flex-direction: column; gap: 8px; }
.coach h4 { margin: 0; font-family: var(--display); font-size: 18px; }
/* go deeper + depth chart */
details.deeper { border-radius: var(--r-lg); background: var(--card-2); }
details.deeper > summary { list-style: none; cursor: pointer; min-height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; color: var(--fav); }
details.deeper > summary::-webkit-details-marker { display: none; }
details.deeper > summary svg { flex: none; transition: transform .15s ease; }
details.deeper[open] > summary svg { transform: rotate(90deg); }
details.deeper > .body { padding: 0 12px 14px; display: flex; flex-direction: column; gap: 12px; }
details.deeper .inset { background: var(--card); }
.dgrp { display: flex; flex-direction: column; }
.drow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--rule); font-size: 15px; align-items: baseline; }
.drow:first-of-type { border-top: 0; }
.drow .pos { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.drow .who b { font-weight: 700; }
.drow .nxt { grid-column: 2; font-size: 13px; color: var(--muted); }
.drow.hurt { background: var(--dog-soft); border-radius: var(--r-md); padding-inline: 8px; border-top-color: transparent; }
.drow.haspts { grid-template-columns: 44px minmax(0, 1fr) auto; }
.drow.haspts .nxt { grid-column: 2 / 4; }
.fpts { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fpts b { font-family: var(--display); font-size: 18px; color: var(--fav); }
.fpts small { margin-left: 3px; font-size: 11px; color: var(--muted); }
.sx { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: var(--pill); background: var(--card-2); vertical-align: 1px; white-space: nowrap; }

  let out = "";
  if (C.spread && fa) {
    out += `<div class="inset" style="display:flex;flex-direction:column;gap:6px"><h2>The spread, and nearby numbers</h2><div class="lad"><div class="lrow h"><span>${esc(N[fa])} line</span><span>Favorite · push · underdog</span><span class="nums">${esc(N[fa])} / ${esc(N[dg])}</span></div>${C.spread.rows.map(r => `<div class="lrow${r.posted ? " now" : ""}"><span>${esc(N[fa])} −${f1(r.line)}${r.posted ? " · posted" : ""}</span><span class="split" role="img" aria-label="Favorite ${Math.round(r.fav)}%, push ${Math.round(r.push)}%, underdog ${Math.round(r.dog)}%"><i class="a" style="width:${r.fav}%"></i><i class="p" style="width:${r.push}%"></i><i class="b" style="width:${r.dog}%"></i></span><span class="nums">${Math.round(r.fav)}% / ${Math.round(r.dog)}%${r.push >= 0.5 ? `<br><span class="small muted">push ${Math.round(r.push)}%</span>` : ""}</span></div>`).join("")}</div><p class="note">From ${C.spread.n.toLocaleString()} games since 2010 where the favorite was laying ${esc(C.spread.lo)} to ${esc(C.spread.hi)} points. Each row is the same game at a different number. Buying points means moving toward the side you bet, at a worse price; watch where whole numbers like 3 and 7 add pushes.</p></div>`;
  }
  if (C.total) {
    out += `<div class="inset" style="display:flex;flex-direction:column;gap:6px"><h2>The total, and nearby numbers</h2><div class="lad"><div class="lrow h"><span>Total</span><span>Over · push · under</span><span class="nums">Over / under</span></div>${C.total.rows.map(r => `<div class="lrow${r.posted ? " now" : ""}"><span>${f1(r.line)}${r.posted ? " · posted" : ""}</span><span class="split" role="img" aria-label="Over ${Math.round(r.over)}%, push ${Math.round(r.push)}%, under ${Math.round(r.under)}%"><i class="o" style="width:${r.over}%"></i><i class="p" style="width:${r.push}%"></i><i class="u" style="width:${r.under}%"></i></span><span class="nums">${Math.round(r.over)}% / ${Math.round(r.under)}%${r.push >= 0.5 ? `<br><span class="small muted">push ${Math.round(r.push)}%</span>` : ""}</span></div>`).join("")}</div><p class="note">From ${C.total.n.toLocaleString()} games since 2010 with a total of ${esc(C.total.lo)} to ${esc(C.total.hi)}.</p></div>`;
  }
  const body = out + `<p class="note">History shows how often numbers like these cash. It isn't a prediction for this game, and the posted line is usually close to 50/50 by design.</p>`;
  return list(C.notes || []) + (out ? deeper(`cash|${g.game_id}`, "Go deeper: the full ladder", body) : "");
}
function priceView(g) {
  const P = g.price || { rows: [], notes: [] };
  if (!P.rows.length) return `<p class="small muted">Prices for this game aren't in our data yet.</p>`;
  const rows = P.rows.map(r => `<div class="inset" style="display:flex;flex-direction:column;gap:2px"><h2>${esc(r.bet)}</h2>${r.sides.map(s => `<div class="prow"><span>${esc(s.label)}</span><b>${mlTxt(s.odds)}</b><span class="be">wins ${f1(s.breakeven)}% to break even</span></div>`).join("")}<p class="note">Sportsbook's cut on this bet: about ${f1(r.hold)}%.</p></div>`).join("");
  return list(P.notes) + deeper(`price|${g.game_id}`, "Go deeper: every price and break-even", `<div class="gd">${rows}</div><p class="note">Break-even is how often a bet at that price has to win for you to come out even over time. −110 needs 52.4%. Prices vary by sportsbook, so compare before you bet.</p>`);
}
function spotsView(g) {
  const S = g.spots || [];
  if (!S.length) return `<p class="small muted">No common schedule or situation spots apply to this game.</p>`;
  return list(S.map(s => s.text), "") + `<p class="note">League-wide records for every team in the same spot, regular season and playoffs since 2010. Most land close to 50%, which is a reminder that the line usually accounts for these situations already.</p>`;
}
function coachView(g) {
  const C = g.coaches || [];
  if (!C.length) return `<p class="small muted">Coaching data isn't available for this game yet.</p>`;
  return `<div class="paths">${C.map(c => `<div class="path ${role(g, c.team) || "neutral"} coach"><div class="path-h"><span>${esc(g.names[c.team])}</span><b>${esc(c.coach)}</b></div>${list(c.lines, role(g, c.team))}</div>`).join("")}</div><p class="note">Play-calling numbers come from regular-season games each coach ran over this season and last, ranked among this season's head coaches with enough plays. Against-the-spread records cover every game in our data (since 1999) where he was the head coach.</p>`;
}
function viewGame(i) {
  const g = D.games[i], N = g.names, fa = g.fav, dg = g.dog;
  const sideHtml = t => `<div class="side ${role(g, t)}"><span class="nm">${N[t]}</span><span class="rec">${rec(g, t)}${g.fav === t ? " · favorite" : g.dog === t ? " · underdog" : ""}</span><span class="sc">${f1(g.implied[t])}</span></div>`;
  let out = `<button type="button" class="back" data-back><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>All games</button>
  <section class="card hero">
    <span class="gtop"><span>${g.final ? "Final" : kick(g.kickoff)}</span><span>${where(g)}</span></span>
    <div class="vs">${sideHtml(g.away)}<span class="at">at</span>${sideHtml(g.home)}</div>
    <p class="hero-sub">The score the line implies${g.final ? ` · Final: ${N[g.away]} ${g.final.away}, ${N[g.home]} ${g.final.home}` : ""}</p>
    <div class="lines" style="justify-content:center">${linePills(g)}</div>
    ${g.win && fa ? `<span class="winbar" role="img" aria-label="Win chance ${N[fa]} ${Math.round(g.win[fa])}%, ${N[dg]} ${Math.round(g.win[dg])}%"><span class="f" style="width:${g.win[fa]}%">${N[fa]} ${Math.round(g.win[fa])}%</span><span class="d" style="width:${g.win[dg]}%">${Math.round(g.win[dg])}% ${N[dg]}</span></span>` : ""}
  </section>`;
  const K = g.key_injuries || [];
  if (K.length) out += `<section class="card alert"><h3>${WARN.replace(/16/g, "20")}Key injuries to watch</h3>${list(K.map(k => k.text), "dog")}<p class="note">These are the players each offense runs through. Statuses are official once a team posts its final report; before that we show practice participation. If the line moves before kickoff, this is a likely reason. Full list in the injury report below.</p></section>`;
  out += gameDay(g);
  const M = g.moves;
  const mv = M ? `<div class="inset" style="display:flex;flex-direction:column;gap:8px"><h2>Line movement</h2>${M.changes.length ? list(M.changes, "fav") : `<p class="small">No movement since we started tracking this game (${esc(M.since)}).</p>`}${M.snaps > 1 ? `<p class="note">${M.history.map(z => `${esc(z.t)}: ${esc(z.line)}, total ${f1(z.total)}`).join(" · ")}</p>` : ""}<p class="note">We check the line every 12 hours. Movement usually means injury news, weather, or heavy betting on one side.</p></div>` : "";
  out += sec(1, "What the line says", mv + list(g.says));
  // home field ladder
  let ladder = "";
  if (fa && !g.neutral) {
    const favHome = fa === g.home, hfa = D.hfa;
    const neutralL = favHome ? g.line - hfa : g.line + hfa, flip = favHome ? g.line - 2 * hfa : g.line + 2 * hfa;
    const atFav = favHome ? g.line : flip, atDog = favHome ? flip : g.line;
    const rung = (lab, v, now) => `<div class="rung${now ? " now" : ""}"><span>${lab}</span><b>${v >= 0.5 ? "−" + f1(v) : v <= -0.5 ? "+" + f1(-v) : "PK"}</b><span>${N[fa]}</span></div>`;
    ladder = `<div class="ladder">${rung(`At ${N[fa]}`, atFav, favHome)}${rung("Neutral field", neutralL, false)}${rung(`At ${N[dg]}`, atDog, !favHome)}</div>`;
  }
  out += sec(2, "Home field, taken out", ladder + list(g.homefield));
  // market vs stats
  const mx = Math.max(6, Math.abs(g.gap_market), Math.abs(g.gap_stats)) * 1.15;
  const bar = (v, lab) => { const w = Math.abs(v) / mx * 50; const left = v >= 0 ? 50 : 50 - w; const t = v >= 0 ? g.home : g.away; const col = role(g, t) === "dog" ? "var(--dog)" : "var(--fav)"; return `<div class="mrow"><span>${lab}</span><div class="track"><span class="mid"></span><span class="bar" style="left:${left}%;width:${Math.max(w, 1.5)}%;background:${col}">${Math.abs(v) >= 1 ? f1(Math.abs(v)) : ""}</span></div></div>`; };
  out += sec(3, "Why it's set here", `<div class="inset mvs"><span class="small muted">How much better, on a neutral field (points)</span>${bar(g.gap_market, "The line")}${bar(g.gap_stats, "This season's stats")}<div class="axis"><span>← ${N[g.away]}</span><span>${N[g.home]} →</span></div></div>` + list(g.why));
  // matchups
  const units = g.units.map(u => {
    const et = u.edge >= 15 ? u.off : u.edge <= -15 ? u.def : null;
    const tagc = et ? (role(g, et) === "dog" ? "d" : "o") : "";
    const tagt = et ? `Edge: ${N[et]} ${et === u.off ? "offense" : "defense"}` : "Even matchup";
    const rw = r => Math.round((33 - r) / 32 * 100);
    return `<div class="unit"><div class="unit-h"><b>${N[u.off]} ${u.oname} vs ${N[u.def]} ${u.dname}</b><span class="tag ${tagc}">${tagt}</span></div>
      <div class="pbar"><span>${N[u.off]} off</span><span class="t"><i style="width:${rw(u.off_rank)}%;background:${role(g, u.off) === "dog" ? "var(--dog)" : "var(--fav)"}"></i></span><span class="num">${ord(u.off_rank)}</span></div>
      <div class="pbar"><span>${N[u.def]} def</span><span class="t"><i style="width:${rw(u.def_rank)}%;background:${role(g, u.def) === "dog" ? "var(--dog)" : "var(--fav)"}"></i></span><span class="num">${ord(u.def_rank)}</span></div></div>`;
  }).join("");
  out += sec(4, "The matchups", `<p class="small muted">Rank out of 32 teams by value per play (expected points added per dropback or per run, not yards). Built from this season's games, adjusted for the opponents each team has faced, and mixed with last season's numbers, which count less each week as more games are played. 1st is best, for offenses and defenses alike. A longer bar means a better unit.</p><div>${units}</div>`);
  out += sec(5, "How the game should play out", list(g.script));
  // paths
  const P = g.paths;
  const pathCard = (p, cls, kicker) => p ? `<div class="path ${cls}"><div class="path-h"><span>${kicker}</span><b>${esc(p.label)}</b></div>${list(p.steps, cls)}${p.players && p.players.length ? `<p class="watch">Players at the center of this path: <b>${p.players.map(esc).join(", ")}</b></p>` : ""}</div>` : "";
  out += sec(6, "How each side cashes", `<div class="paths">${pathCard(P.fav, fa ? "fav" : "neutral", fa ? "Favorite covers if" : "Home side wins if")}${pathCard(P.dog, fa ? "dog" : "neutral", fa ? "Underdog covers if" : "Road side wins if")}</div><p class="note">${esc(g.keynum.text)}</p>`);
  out += sec(7, "The total, both ways", `<div class="paths"><div class="path neutral"><div class="path-h"><span>Over hits if</span><b>Over ${f1(g.total)}</b></div>${list(g.total_paths.over, "ok")}</div><div class="path neutral"><div class="path-h"><span>Under hits if</span><b>Under ${f1(g.total)}</b></div>${list(g.total_paths.under)}</div></div>`);
  out += sec(8, "How often lines like this cash", ladderView(g));
  out += sec(9, "Price check", priceView(g));
  out += sec(10, "Schedule spots", spotsView(g));
  out += sec(11, "Coaching tendencies", coachView(g));
  out += sec(12, "Depth chart", depthView(g));
  out += sec(13, "Injury report", injView(g));
  out += sec(14, "Head-to-head history", h2hView(g));
  out += sec(15, "Betting trends", trendView(g));
  out += `<p class="note" style="text-align:center">Not a pick. Every line above is generated from the betting line and this season's data, so you can decide which script you believe.</p>`;
  return out + foot();
}

/* ---------- market ratings ---------- */
function viewRatings() {
  const R = D.ratings, mx = Math.max(...R.map(r => Math.abs(r.rating))) * 1.1;
  let out = topBar() + `<header style="display:flex;flex-direction:column;gap:10px"><h1>How Vegas rates every team.</h1>
    <p class="lede">Solved from <b>every spread posted this season</b>. Each number is how many points better or worse than an average team the market thinks a team is, on a neutral field. Home field is worth about <b>${f1(D.hfa)}</b> points.</p></header>
    <section class="card"><p class="small muted">To estimate any spread: home team's rating minus road team's rating, plus ${f1(D.hfa)}.</p><div>`;
  R.forEach(r => { const w = Math.abs(r.rating) / mx * 50; const left = r.rating >= 0 ? 50 : 50 - w; out += `<div class="rrow"><span class="rk">${r.rank}</span><span>${esc(r.name)}</span><span class="rtrack"><span class="mid"></span><i style="left:${left}%;width:${w}%;background:${r.rating >= 0 ? "var(--fav)" : "var(--dog)"}"></i></span><span class="v">${r.rating > 0 ? "+" : r.rating < 0 ? "−" : ""}${f1(Math.abs(r.rating))}</span></div>`; });
  return out + `</div></section>` + foot();
}

/* ---------- how to read ---------- */
function hideStart() { try { return localStorage.getItem("ss-hide-start") === "1" || st.hideStart; } catch (e) { return !!st.hideStart; } }
function viewHow() {
  const K = D.keynum;
  return topBar() + `<header style="display:flex;flex-direction:column;gap:10px"><h1>How to use SportScript.</h1><p class="lede">Sportsbooks set lines using the best information in the world. The line is the market's forecast. <b>We translate it into plain English</b>, so you can decide which side's story you believe.</p></header>
  <section class="card sec start"><h3>Reading a game page, top to bottom</h3><ol class="steps">
    <li><span><b>The score up top</b> is what the betting line implies, for example Ravens 21.2, Browns 18.2. Blue is the favorite, orange is the underdog.</span></li>
    <li><span><b>Key injuries to watch</b> appears when a team's quarterback, lead running back or top receiver is hurt. This is the most common reason a line moves.</span></li>
    <li><span><b>Moneyline and weather</b> show what a $100 bet pays to win outright, each team's real win chance, and the kickoff forecast.</span></li>
    <li><span><b>Sections 1–3, what the line says and why:</b> Home field taken out, and whether this season's stats agree with the line.</span></li>
    <li><span><b>Section 4, the matchups:</b> Each offense against the other team's defense, ranked 1st (best) to 32nd.</span></li>
    <li><span><b>Sections 5–7, how the game plays out and how each side cashes:</b> This is the heart of it: what has to happen for each bet to win.</span></li>
    <li><span><b>Sections 8–9, how often lines like this cash and the price check:</b> How often favorites and totals this size have cleared the number and the ones around it, what the price means for your break-even, and whether the moneyline and spread agree.</span></li>
    <li><span><b>Sections 10–11, schedule spots and coaching tendencies:</b> Byes, short weeks, division games and long trips, plus how each head coach handles 4th downs, early downs and protecting a lead.</span></li>
    <li><span><b>Section 12, depth chart:</b> Every starter and backup, with injured starters highlighted and the next player in line.</span></li>
    <li><span><b>Sections 13–15, injuries, head-to-head and trends:</b> Background to check before you decide.</span></li>
  </ol><p class="note">Use the week buttons on the Games tab to see past results or next week's early lines.</p></section>
  <section class="card sec"><h3>Quick glossary</h3><div class="gloss">
    <div><b>Cover:</b> win the bet against the spread. The favorite covers by winning by more than the spread; the underdog covers by winning, or losing by less.</div>
    <div><b>ATS (against the spread):</b> a team's record at covering. 3-2 ATS means they covered 3 of 5.</div>
    <div><b>Push:</b> the result lands exactly on the number, and your bet is refunded.</div>
    <div><b>Moneyline:</b> a bet on who wins, no spread. −150 means bet $150 to win $100; +130 means bet $100 to win $130.</div>
    <div><b>Over/under (total):</b> a bet on whether both teams combined score more or less than the number.</div>
    <div><b>Break-even:</b> how often a bet has to win to make money over time at its price. −110 needs 52.4%; −120 needs 54.5%; +150 needs 40%.</div>
    <div><b>Buying points:</b> taking a better spread or total for a worse price. A half point through 3 or 7 matters most, because so many games land on those margins.</div>
    <div><b>Line movement:</b> the spread or total changing during the week, usually because of injuries, weather or heavy betting on one side.</div>
  </div></section>
  <section class="card sec"><h3>The spread</h3><p>The favorite gives points, the underdog gets them. <b>Chiefs −7.5</b> means Kansas City has to win by 8 or more. <b>Chargers +7.5</b> wins if Los Angeles wins or loses by 7 or fewer. A whole-number spread can push: win by exactly that number and the bet is refunded.</p></section>
  <section class="card sec"><h3>The total and the implied score</h3><p>The total is the combined points. Put the spread and total together and you get the score the market expects: favorite = (total + spread) ÷ 2, underdog = (total − spread) ÷ 2. A 47.5 total with a 3.5 spread works out to about 25.5 to 22.</p></section>
  <section class="card sec"><h3>Home field</h3><p>Home field is worth about <b>${f1(D.hfa)}</b> points in this season's lines, less than the classic 3. A road favorite of 5 is about ${f1(5 + D.hfa)} better on a neutral field and would be about ${f1(5 + 2 * D.hfa)} at home.</p></section>
  <section class="card sec"><h3>Key numbers</h3><p>NFL games end on certain margins far more than others because of field goals and touchdowns. Since 2015, <b>${K[3]}%</b> of games ended on exactly 3, <b>${K[7]}%</b> on 7, ${K[6]}% on 6, ${K[10]}% on 10. That's why −2.5 and −3.5 are very different bets, while −4.5 and −5.5 are close.</p></section>
  <section class="card sec"><h3>The moneyline and win chance</h3><p>The moneyline is a bet on who wins. We convert both sides to a win chance and take out the sportsbook's cut, so the two add to 100%.</p></section>
  <section class="card sec"><h3>What we don't do</h3><p>We don't sell picks or claim a winning record. We tested models against two seasons of closing lines, and none beat them by enough to matter. So instead of guessing, we show you what the line already knows and the paths each side needs, and you decide which story you believe.</p></section>` + foot();
}

function foot() { return `<footer class="foot"><span>Lines and stats: nflverse open NFL data · updated ${esc(D.built)}. Lines move: check your sportsbook before betting.</span><span>21+ · Gambling problem? Call 1-800-GAMBLER</span></footer>`; }

function render() {
  app.innerHTML = st.game !== null ? viewGame(st.game) : st.tab === "ratings" ? viewRatings() : st.tab === "how" ? viewHow() : viewGames();
  const pw = app.querySelector('.wkbar [aria-pressed="true"]'); if (pw) pw.parentElement.scrollLeft = pw.offsetLeft - 16;
  document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.tab === st.tab && st.game === null) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
}
function go(fn) { fn(); render(); window.scrollTo(0, 0); }
app.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.hasAttribute("data-hide-start")) { st.hideStart = true; try { localStorage.setItem("ss-hide-start", "1"); } catch (e) {} const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.hasAttribute("data-goto-how")) { go(() => { st.tab = "how"; st.game = null; }); return; }
  if (t.hasAttribute("data-theme-toggle")) { const nt = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = nt; try { localStorage.setItem("ss-theme", nt); } catch (e) {} render(); return; }
  if (t.dataset.wk) { st.wk = +t.dataset.wk; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.tt) { const [k, v] = t.dataset.tt.split("|"); st.tt[k] = v; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.game !== undefined) go(() => { st.game = +t.dataset.game; st.tt = {}; });
  else if (t.hasAttribute("data-back")) go(() => { st.game = null; });
});
app.addEventListener("toggle", ev => { const d = ev.target; if (d.dataset && d.dataset.openKey) st.open[d.dataset.openKey] = d.open; }, true);
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => go(() => { st.tab = b.dataset.tab; st.game = null; })));
render();
</script>

</body>
</html>
